[build]
builder = "RAILPACK"
buildCommand = "pnpm --filter @jnj/types build && pnpm --filter @jnj/web build"
watchPatterns = [
  "apps/web/**",
  "packages/types/**",
  "package.json",
  "pnpm-lock.yaml",
  "pnpm-workspace.yaml",
  "tsconfig.base.json"
]

[deploy]
startCommand = "pnpm --filter @jnj/web start"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
