services:
  postgres:
    image: postgres:16-alpine
    container_name: jnj-postgres
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: jnj
      POSTGRES_PASSWORD: jnj_secret
      POSTGRES_DB: jnj_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jnj -d jnj_dev"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
